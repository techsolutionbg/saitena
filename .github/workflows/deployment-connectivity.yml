name: Approved connectivity check (no deployment key)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type NETWORK-CHECK; this job cannot deploy
        required: true
permissions:
  contents: read
concurrency:
  group: saitena-deployment-connectivity
  cancel-in-progress: false
jobs:
  network:
    if: github.ref == 'refs/heads/main' && github.actor == 'techsolutionbg' && github.triggering_actor == 'techsolutionbg' && inputs.confirmation == 'NETWORK-CHECK'
    environment: deployment-connectivity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {contents: read, id-token: write}
    steps:
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        with:
          oauth-client-id: ${{ vars.SAITENA_TAILSCALE_CLIENT_ID }}
          audience: ${{ vars.SAITENA_TAILSCALE_AUDIENCE }}
          tags: tag:ci-saitena-preview
          version: 1.104.6
          use-cache: 'false'
          log-mode: quiet
      - name: Verify pinned SSH endpoint without an authentication key
        env:
          DEPLOY_HOST: ${{ vars.SAITENA_DEPLOY_HOST }}
          KNOWN_HOSTS: ${{ secrets.SAITENA_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^100\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -n "$KNOWN_HOSTS"
          umask 077
          HOSTS=$(mktemp); SCAN=$(mktemp); ERRORS=$(mktemp)
          trap 'rm -f "$HOSTS" "$SCAN" "$ERRORS"' EXIT
          printf '%s\n' "$KNOWN_HOSTS" > "$HOSTS"
          ssh-keyscan -T 10 -t ed25519 "$DEPLOY_HOST" > "$SCAN" 2>/dev/null
          EXPECTED=$(ssh-keygen -F "$DEPLOY_HOST" -f "$HOSTS" | awk '$2 == "ssh-ed25519" {print $3}')
          ACTUAL=$(awk '$2 == "ssh-ed25519" {print $3}' "$SCAN")
          test -n "$EXPECTED" && test "$ACTUAL" = "$EXPECTED"
          set +e
          ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityFile=none -o IdentityAgent=none -o PreferredAuthentications=none -o PubkeyAuthentication=no -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$HOSTS" "saitena-deploy@$DEPLOY_HOST" </dev/null >/dev/null 2>"$ERRORS"
          RESULT=$?
          set -e
          test "$RESULT" -eq 255
          node -e 'const fs=require("fs");if(!/Permission denied/.test(fs.readFileSync(process.argv[1],"utf8")))process.exit(1)' "$ERRORS"
          echo 'Pinned SSH reachable; unauthenticated access denied; no deployment used.'
      - name: Verify CI cannot reach protected server ports
        env:
          DEPLOY_HOST: ${{ vars.SAITENA_DEPLOY_HOST }}
        run: |
          node <<'NODE'
          const net=require('net');
          (async()=>{for(const port of [80,443,2019,2375,3306]){
            const connected=await new Promise(resolve=>{let done=false;const finish=x=>{if(!done){done=true;s.destroy();resolve(x)}};const s=net.connect({host:process.env.DEPLOY_HOST,port});s.setTimeout(3000,()=>finish(false));s.on('connect',()=>finish(true));s.on('error',()=>finish(false));});
            if(connected)throw Error('CI network isolation failed');
          }console.log('Protected-port negative checks passed.');})().catch(()=>process.exit(1));
          NODE
