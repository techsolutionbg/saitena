name: Saitena checks (no deployment)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saitena-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix tools/lint --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:contact
      - run: npm run test:contact:config
      - run: node scripts/audit-git-candidate.mjs
      - run: npm run build
        env:
          NEXT_PUBLIC_AUTH_ENABLED: "false"
          NEXT_PUBLIC_INDEXING_ENABLED: "false"
          NEXT_TELEMETRY_DISABLED: "1"
      - run: node scripts/check-production-candidate.mjs
      - run: docker build --target candidate -f .deployment/Dockerfile -t saitena-public:check .
