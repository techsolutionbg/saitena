name: Approved production release
on:
  workflow_run:
    workflows: [Saitena checks (no deployment)]
    branches: [main]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: saitena-production
  cancel-in-progress: false
jobs:
  authorize:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && vars.SAITENA_AUTODEPLOY_ENABLED == 'true'
    permissions:
      { contents: read, actions: read, deployments: read, pull-requests: read }
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.policy.outputs.sha }}
      release: ${{ steps.policy.outputs.release }}
      mode: ${{ steps.policy.outputs.mode }}
      prelaunch: ${{ steps.policy.outputs.prelaunch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24 }
      - id: policy
        env:
          GH_TOKEN: ${{ secrets.SAITENA_RELEASE_POLICY_TOKEN || github.token }}
        run: node scripts/authorize-main-deployment.mjs
  build:
    timeout-minutes: 30
    needs: authorize
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write }
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      image_id: ${{ steps.identity.outputs.image_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24 }
      - if: needs.authorize.outputs.mode == 'public-demo'
        run: node scripts/check-release-readiness.mjs
        env: { SAITENA_RELEASE_MODE: public-demo }
      - if: needs.authorize.outputs.mode == 'customer-auth'
        run: node scripts/customer-auth-release.mjs
        env:
          NEXT_PUBLIC_RELEASE_MODE: customer-auth
          NEXT_PUBLIC_AUTH_ENABLED: "true"
          NEXT_PUBLIC_CUSTOMER_AUTH_ENABLED: "true"
          NEXT_PUBLIC_CUSTOMER_REGISTRATION_ENABLED: ${{ needs.authorize.outputs.prelaunch == 'true' && 'true' || 'false' }}
          NEXT_PUBLIC_CUSTOMER_PRELAUNCH_ENABLED: ${{ needs.authorize.outputs.prelaunch }}
          NEXT_PUBLIC_INDEXING_ENABLED: "false"
          NEXT_PUBLIC_API_URL: https://api.saitena.com
          NEXT_PUBLIC_CLIENT_AREA_URL: https://portal.saitena.com
          CONTACT_MAIL_MODE: disabled
      - name: Build and publish exact release image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.authorize.outputs.sha }}
          ACTOR: ${{ github.actor }}
          MODE: ${{ needs.authorize.outputs.mode }}
          PRELAUNCH: ${{ needs.authorize.outputs.prelaunch }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1' EXIT
          IMAGE=ghcr.io/techsolutionbg/saitena/public
          case "$MODE" in public-demo) AUTH=false ;; customer-auth) AUTH=true ;; *) exit 1 ;; esac
          case "$PRELAUNCH" in true) test "$MODE" = customer-auth; REGISTRATION=true ;; false) REGISTRATION=false ;; *) exit 1 ;; esac
          docker build --target release --build-arg "NEXT_PUBLIC_RELEASE_MODE=$MODE" --build-arg "NEXT_PUBLIC_AUTH_ENABLED=$AUTH" --build-arg "NEXT_PUBLIC_CUSTOMER_AUTH_ENABLED=$AUTH" --build-arg "NEXT_PUBLIC_CUSTOMER_REGISTRATION_ENABLED=$REGISTRATION" --build-arg "NEXT_PUBLIC_CUSTOMER_PRELAUNCH_ENABLED=$PRELAUNCH" --label "org.opencontainers.image.revision=$SHA" --label "org.opencontainers.image.source=https://github.com/techsolutionbg/saitena" -f .deployment/Dockerfile -t "$IMAGE:$SHA-$MODE" .
          docker push "$IMAGE:$SHA-$MODE"
          DIGEST=$(docker image inspect "$IMAGE:$SHA-$MODE" --format '{{index .RepoDigests 0}}')
          [[ "$DIGEST" =~ ^ghcr.io/techsolutionbg/saitena/public@sha256:[a-f0-9]{64}$ ]]
          test "$(gh api /users/techsolutionbg/packages/container/saitena%2Fpublic --jq .visibility)" = private
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          if [ "$MODE" = customer-auth ]; then PURPOSE='Approve the public image for coordinated Auth only; this run does not deploy.'; else PURPOSE='Approve production to deploy this exact candidate.'; fi
          printf 'Main commit: `%s`\n\nImmutable image: `%s`\n\n%s\n' "$SHA" "$DIGEST" "$PURPOSE" >> "$GITHUB_STEP_SUMMARY"
      - name: Inspect approved public Auth image identity
        if: needs.authorize.outputs.mode == 'customer-auth'
        id: identity
        env:
          SHA: ${{ needs.authorize.outputs.sha }}
          IMAGE: ${{ steps.image.outputs.digest }}
        run: node scripts/inspect-auth-image.mjs
  deploy:
    timeout-minutes: 15
    needs: [authorize, build]
    permissions:
      {
        contents: read,
        actions: read,
        deployments: read,
        id-token: write,
        packages: read,
        pull-requests: read,
      }
    environment:
      name: production
      url: https://saitena.com
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24 }
      - name: Revalidate main and protections after owner approval
        env:
          GH_TOKEN: ${{ secrets.SAITENA_RELEASE_POLICY_TOKEN || github.token }}
        run: |
          git fetch --no-tags origin main
          node scripts/authorize-main-deployment.mjs
      - name: Join restricted deployment tailnet
        if: needs.authorize.outputs.mode == 'public-demo'
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        with:
          oauth-client-id: ${{ vars.SAITENA_TAILSCALE_CLIENT_ID }}
          audience: ${{ vars.SAITENA_TAILSCALE_AUDIENCE }}
          tags: tag:ci-saitena-preview
          version: 1.104.6
          use-cache: "false"
          log-mode: quiet
      - name: Deploy, verify externally and accept or roll back
        if: needs.authorize.outputs.mode == 'public-demo'
        env:
          DEPLOY_KEY: ${{ secrets.SAITENA_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.SAITENA_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.SAITENA_DEPLOY_HOST }}
          SHA: ${{ needs.authorize.outputs.sha }}
          IMAGE: ${{ needs.build.outputs.digest }}
          RELEASE: ${{ needs.authorize.outputs.release }}
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: node scripts/deploy-approved-main.mjs
      - name: Record coordinated Auth approval only (no deployment)
        if: needs.authorize.outputs.mode == 'customer-auth'
        env:
          SHA: ${{ needs.authorize.outputs.sha }}
          IMAGE: ${{ needs.build.outputs.digest }}
          IMAGE_ID: ${{ needs.build.outputs.image_id }}
        run: node scripts/record-auth-release-approval.mjs
