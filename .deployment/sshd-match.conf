Match User saitena-deploy
    AuthorizedKeysFile /etc/ssh/authorized_keys/saitena-deploy
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY no
    DisableForwarding yes
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitUserRC no
    ForceCommand /usr/bin/sudo -n /usr/local/libexec/saitena-deploy
Match all
