# Local HTTPS staging, no production infrastructure or API connection.
name: saitena-website-https-staging
services:
  site:
    image: ${SAITENA_STAGING_IMAGE:?Set tested local image ID}
    ports: ["127.0.0.1:13444:3000"]
    environment:
      CONTACT_MAIL_MODE: mailpit
      CONTACT_SMTP_HOST: mailpit
      CONTACT_SMTP_PORT: "1025"
      CONTACT_MAIL_FROM: contact@saitena.test
      CONTACT_MAIL_TO: inbox@saitena.test
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports: ["127.0.0.1:18028:8025"]
  tls:
    image: caddy:2.10-alpine
    ports: ["127.0.0.1:13443:443"]
    volumes:
      - ./Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - tls_data:/data
    depends_on: [site]
volumes:
  tls_data:
